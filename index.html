<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-50 antialiased">
    <div class="flex min-h-screen items-center justify-center bg-[linear-gradient(135deg,rgba(15,23,42,0.82),rgba(30,41,59,0.6)),url('IMG_3001.jpg')] bg-cover bg-center px-6 py-10">
        <main class="w-full max-w-md rounded-[28px] border border-white/20 bg-white/10 p-8 text-center shadow-[0_25px_70px_rgba(0,0,0,0.35)] backdrop-blur-xl">
            <p class="mb-3 inline-block rounded-full border border-white/15 bg-white/10 px-3 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.3em] text-slate-200">Welcome</p>
            <h1 class="mb-4 text-3xl font-semibold sm:text-4xl">Choose a section</h1>
            <p class="mb-8 text-sm leading-7 text-slate-200 sm:text-base">A soft, glowing landing page with a dreamy glassy look and your favorite photo in the background.</p>
            <div class="flex flex-col gap-3">
                <a class="block rounded-2xl bg-gradient-to-r from-blue-500 to-blue-600 px-4 py-3 font-semibold text-white shadow-lg shadow-blue-950/30 transition duration-200 hover:-translate-y-1 hover:shadow-xl" href="hbd.html">Profile</a>
                <a class="block rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 px-4 py-3 font-semibold text-white shadow-lg shadow-emerald-950/30 transition duration-200 hover:-translate-y-1 hover:shadow-xl" href="miniGM.html">Game</a>
                <a class="block rounded-2xl bg-gradient-to-r from-rose-500 to-rose-600 px-4 py-3 font-semibold text-white shadow-lg shadow-rose-950/30 transition duration-200 hover:-translate-y-1 hover:shadow-xl" href="message.html">Contact</a>
            </div>
        </main>
    </div>
</body>
<script>
    // DOM Elements
    const gate = document.getElementById('password-gate');
    const content = document.getElementById('birthday-content');
    const audio = document.getElementById('thr-audio');
    const secondBtn = document.getElementById('2-btn');
    const threeBtn = document.getElementById('3-btn'); // Matches the HTML ID

    // Logic for THR Button
    secondBtn.addEventListener('click', function() {
        gate.style.display = 'none';
        content.classList.remove('hidden');
        setTimeout(() => {
            content.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'select-none');
        }, 50);

        audio.currentTime = 4; 
        audio.play().catch(error => {
            console.log("Audio play blocked:", error);
        });
    });

    // Audio Loop Logic (4s to 45s)
    audio.addEventListener('timeupdate', function() {
        if (this.currentTime >= 45) {
            this.currentTime = 4;
            this.play();
        }
    });

    // UPDATED: Contact Me Button to WhatsApp
    threeBtn.addEventListener('click', function() {
        window.open('https://wa.me/6285600447763', '_blank');
    });
</script>
</html>
