        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            position: relative;
            min-height: 100vh;
        }

        /* Default Dot Grid Background menggunakan pseudo-element */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #0b0f19;
            background-image: radial-gradient(#1f293d 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        @keyframes fadeBGswitch {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* SwitchBG via Pseudo-elements untuk menghindari bug zoom di Mobile */
        .bg-unlocked::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #0b0f19;
            background-image: url('IMG_0111.jpeg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        .bg-5jul::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #0b0f19;
            background-image: url('IMG_1966.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            animation: fadeBGswitch 1.5s ease-in-out; /* Disesuaikan ke 1.5s agar transisi terasa halus namun responsif */
        }

        /* Optimasi khusus versi Mobile Portrait */
        @media (max-width: 768px) {
            body::before,
            .bg-unlocked::before,
            .bg-5jul::before {
                height: 100vh;
                height: -webkit-fill-available; 
            }
        }

        /* Custom scrollbar for chat container */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.3);
            border-radius: 20px;
        }

        .chat-scroll::-webkit-scrollbar-thumb:hover {
            background-color: rgba(156, 163, 175, 0.5);
        }

        .chat-bubble-enter {
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            animation: chatBubbleIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .typing-bubble {
            animation: typingBubblePulse 1.2s ease-in-out infinite;
        }

        .typing-dot {
            animation: typingDotBounce 1.2s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Animasi huruf Comingsoon selaras dengan typing dot */
        .typing-text-char {
            display: inline-block;
            animation: typingDotBounce 1.2s ease-in-out infinite;
        }

        .typing-text-char:nth-child(1) { animation-delay: 0.0s; }
        .typing-text-char:nth-child(2) { animation-delay: 0.1s; }
        .typing-text-char:nth-child(3) { animation-delay: 0.2s; }
        .typing-text-char:nth-child(4) { animation-delay: 0.3s; }
        .typing-text-char:nth-child(5) { animation-delay: 0.4s; }
        .typing-text-char:nth-child(6) { animation-delay: 0.5s; }
        .typing-text-char:nth-child(7) { animation-delay: 0.6s; }
        .typing-text-char:nth-child(8) { animation-delay: 0.7s; }
        .typing-text-char:nth-child(9) { animation-delay: 0.8s; }
        .typing-text-char:nth-child(10) { animation-delay: 0.9s; }

        @keyframes chatBubbleIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes typingDotBounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.55;
            }
            40% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        @keyframes typingBubblePulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.01);
            }
        }
    </style>
</head>

    function showTypingIndicator() {
      const typingEl = document.createElement('div');
      typingEl.className = 'flex items-end space-x-3 justify-end group select-none mb-4 chat-bubble-enter';
      typingEl.innerHTML = `
        <div class="flex max-w-[40%] flex-col items-end">
          <div class="typing-bubble flex items-center gap-1.5 rounded-2xl rounded-br-none bg-[#1e2640]/80 px-4 py-3 shadow-lg">
            <span class="typing-dot h-2.5 w-2.5 rounded-full bg-white/90"></span>
            <span class="typing-dot h-2.5 w-2.5 rounded-full bg-white/90"></span>
            <span class="typing-dot h-2.5 w-2.5 rounded-full bg-white/90"></span>
          </div>
        </div>
        <div class="flex flex-col items-center space-y-1 w-9">
          <div class="flex h-9 w-9 items-center justify-center rounded-full border border-blue-900/30 bg-[#2c3875] text-xs font-medium text-blue-300 shadow-md">
            iC
          </div>
        </div>
      `;

      chatContainer.appendChild(typingEl);
    }

    function renderNextMessage() {
      if (hasCompleted) {
        return;
      }

      const typingTextHTML = `
        <span class="typing-text-char">C</span>
        <span class="typing-text-char">o</span>
        <span class="typing-text-char">m</span>
        <span class="typing-text-char">i</span>
        <span class="typing-text-char">n</span>
        <span class="typing-text-char">g</span>
        <span class="typing-text-char">s</span>
        <span class="typing-text-char">o</span>
        <span class="typing-text-char">o</span>
        <span class="typing-text-char">n</span>
      `;

      if (messageIndex >= textChat.length) {
        hasCompleted = true;
        setTimeout(() => {
          showTypingIndicator();
          footerPrompt.innerHTML = typingTextHTML;
          setTimeout(() => {
            chatContainer.lastChild?.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }, 100);
        }, 600);
        return;
      }

      const message = textChat[messageIndex];
      applyBackgroundForMessage(message);
      const messageElement = createMessageElement(message, messageIndex);
      chatContainer.appendChild(messageElement);
      
      setTimeout(() => {
        messageElement.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 50);
      
      messageIndex += 1;

      if (messageIndex >= textChat.length) {
        hasCompleted = true;
        setTimeout(() => {
          showTypingIndicator();
          footerPrompt.innerHTML = typingTextHTML;
          setTimeout(() => {
            chatContainer.lastChild?.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }, 100);
        }, 600);
      }
    }

    passwordForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const enteredPassword = passwordInput.value.trim();

      if (enteredPassword === 'sadji') {
        isUnlocked = true;
        // Tidak perlu menghapus bg-dot-grid secara manual karena tertutup oleh pseudo-element ::before baru
        document.body.classList.add('bg-unlocked');
        hidePasswordPrompt();
        
        (function playUnlockAudio() {
          let audio = document.getElementById('unlockAudio');
          if (!audio) {
            audio = document.createElement('audio');
            audio.id = 'unlockAudio';
            audio.src = 'Message.mp3';
            audio.loop = true;
            audio.autoplay = true;
            audio.volume = 0.5;
            audio.setAttribute('playsinline', '');
            document.body.appendChild(audio);
          }
          audio.play().catch(() => {});
        })();

        renderNextMessage();
      } else {
        passwordNotice.textContent = "first date at '*****' cafe";
      }
    });

    document.addEventListener('click', (event) => {
      const clickedInsidePrompt = event.target.closest('#passwordOverlay') || event.target.closest('#passwordForm');

      if (clickedInsidePrompt) {
        return;
      }

      if (!isUnlocked) {
        showPasswordPrompt();
        return;
      }

      renderNextMessage();
    });

    renderNextMessage();
  </script>

</body>

</html>
