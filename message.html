<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BubbleCraft - Chat Bubble Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 1.4s infinite',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        .bg-dot-grid {
            background-color: #0b0f19;
            background-image: radial-gradient(#1f293d 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        /* Custom scrollbar for chat container */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.3);
            border-radius: 20px;
        }

        .chat-scroll::-webkit-scrollbar-thumb:hover {
            background-color: rgba(156, 163, 175, 0.5);
        }

        .chat-bubble-enter {
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            animation: chatBubbleIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes chatBubbleIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body class="bg-dot-grid min-h-screen cursor-pointer text-slate-200 flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-3xl flex flex-col space-y-6 my-auto">
    <header class="w-full rounded-2xl border border-slate-800/60 bg-slate-900/80 px-5 py-4 shadow-lg backdrop-blur">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#3b47ff] text-sm font-semibold text-white shadow-md">
            WA
          </div>
          <div>
            <h1 class="text-base font-semibold text-white">BubbleCraft</h1>
            <p class="text-sm text-slate-400">Live Studio</p>
          </div>
        </div>
        <div class="rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1 text-xs font-medium text-emerald-400">
          Online
        </div>
      </div>
    </header>

    <div id="chatContainer" class="w-full flex flex-col space-y-2">
    </div>
  </div>

  <div class="fixed bottom-4 left-1/2 z-50 -translate-x-1/2 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-slate-200 shadow-[0_8px_30px_rgba(0,0,0,0.25)] backdrop-blur-md backdrop-saturate-150">
    Tap Anywhare
  </div>

  <script>
    // Data chat tiruan untuk pengujian kelompok chat berturut-turut
    const textChat = [
      {
        sender: 'WA',
        text: 'Hey there! Welcome to the BubbleCraft live studio. 👋 Say hello to start chatting!'
      },
      {
        sender: 'WA',
        text: 'Ini adalah chat kedua berturut-turut dari WA, perhatikan logonya pindah ke bawah.'
      },
      {
        sender: 'iChat',
        text: "Wow, this looks super clean! Let's test a few responses."
      },
      {
        sender: 'iChat',
        text: 'Ini chat kedua berturut-turut dari iChat. Logonya juga harus di paling bawah.'
      },
      {
        sender: 'WA',
        text: 'Awesome! Feel free to send messages or use the quick replies below. 🚀'
      }
    ];

    const chatContainer = document.getElementById('chatContainer');
    let messageIndex = 0;

    function createMessageElement(message, index) {
      const isUser = message.sender === 'iChat';
      const nextMessage = textChat[index + 1];
      const isLastInGroup = !nextMessage || nextMessage.sender !== message.sender;

      const messageEl = document.createElement('div');
      messageEl.className = `flex items-end space-x-3 ${isUser ? 'justify-end' : ''} group select-none ${isLastInGroup ? 'mb-4' : ''} chat-bubble-enter`;
      messageEl.style.animationDelay = `${index * 180}ms`;

      let bubbleClasses = '';
      if (isUser) {
        bubbleClasses = `bg-[#1e2640]/80 text-white rounded-2xl ${isLastInGroup ? 'rounded-br-none' : ''}`;
      } else {
        bubbleClasses = `bg-emerald-600/90 border border-emerald-500/40 text-white rounded-2xl ${isLastInGroup ? 'rounded-bl-none' : ''}`;
      }

      messageEl.innerHTML = `
        ${!isUser ? `
          <div class="flex flex-col items-center space-y-1 w-9">
            ${isLastInGroup ? `
              <div class="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-500 text-sm font-semibold text-white shadow-md">
                WA
              </div>
            ` : '<div class="h-9 w-9"></div>'}
          </div>
        ` : ''}
        
        <div class="flex max-w-[80%] flex-col ${isUser ? 'items-end' : ''}">
          <div class="px-5 py-3 shadow-lg flex flex-col space-y-1.5 ${bubbleClasses}">
            <div class="text-[15px] leading-relaxed">
              ${message.text}
            </div>
            
            ${isUser ? `
              <div class="flex items-center space-x-1 justify-end opacity-70">
                <span class="text-[11px] font-medium text-blue-100">9:40 PM</span>
                <svg class="h-3.5 w-3.5 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5M4.5 12.75l6 6 9-13.5" />
                </svg>
              </div>
            ` : `
              <div class="flex justify-start opacity-60">
                <span class="text-[11px] font-medium text-slate-400">9:40 PM</span>
              </div>
            `}
          </div>
        </div>

        ${isUser ? `
          <div class="flex flex-col items-center space-y-1 w-9">
            ${isLastInGroup ? `
              <div class="flex h-9 w-9 items-center justify-center rounded-full border border-blue-900/30 bg-[#2c3875] text-xs font-medium text-blue-300 shadow-md">
                iC
              </div>
            ` : '<div class="h-9 w-9"></div>'}
          </div>
        ` : ''}
      `;

      return messageEl;
    }

    function renderNextMessage() {
      if (messageIndex >= textChat.length) {
        return;
      }

      const message = textChat[messageIndex];
      chatContainer.appendChild(createMessageElement(message, messageIndex));
      messageIndex += 1;
    }

    document.addEventListener('click', () => {
      renderNextMessage();
    });

    renderNextMessage();
</script>

</body>

</html>
